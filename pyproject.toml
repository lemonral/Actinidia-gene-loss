[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actinidia-gene-loss"
version = "0.2.0"
description = "Manifest-driven comparative gene-loss and phylogeny workflows for Actinidia"
requires-python = ">=3.10"
authors = [{name = "Actinidia gene-loss contributors"}]
license = {file = "LICENSE"}
dependencies = [
  "biopython>=1.80",
  "numpy>=1.23",
  "pandas>=1.5",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.6", "Pillow>=9.0"]
statistics = ["scipy>=1.9", "statsmodels>=0.13"]
workbooks = ["openpyxl>=3.0"]
test = ["pytest>=7"]
all = [
  "matplotlib>=3.6",
  "openpyxl>=3.0",
  "Pillow>=9.0",
  "pytest>=7",
  "scipy>=1.9",
  "statsmodels>=0.13",
]

[project.scripts]
geneloss = "geneloss_repro.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
